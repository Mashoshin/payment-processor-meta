openapi: 3.0.3
info:
  title: ledger
  version: 1.0.0
  description: >
    Журнал проводок (двойная запись). Проводки неизменяемы, только дозапись.
    Баланс = sum(credit) - sum(debit), отрицательный допустим.
    Суммы — целые числа в копейках.
servers:
  - url: http://localhost:8082
paths:
  /health:
    get:
      summary: Проверка живости
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  service: { type: string, enum: [ledger] }
  /entries:
    post:
      summary: Записать массив проводок атомарно
      description: >
        Тело — массив из 1..2 проводок, записываемых атомарно (всё-или-ничего):
        либо записаны все, либо ни одной. Если хотя бы одна проводка невалидна
        (debit==credit, amount<=0, формат счёта) или массив пуст/длиннее 2 —
        400 и в журнал не пишется ничего.
        Идемпотентно по payment_id: если проводки с таким payment_id в журнале
        уже есть, ничего не дописывается — возвращаются ранее записанные
        проводки (200). Содержимое повторного запроса не сверяется:
        payment_id — единственный ключ.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 2
              items: { $ref: '#/components/schemas/EntryInput' }
      responses:
        '201':
          description: >
            Проводки записаны (все переданные, в том же порядке). Отдаётся
            только для ранее не встречавшегося payment_id.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Entry' }
        '200':
          description: >
            Проводки с этим payment_id уже были записаны ранее. В журнал
            ничего не дописано; возвращены ранее записанные проводки с теми же
            id, в порядке записи.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Entry' }
        '400':
          description: >
            Ошибка валидации (debit==credit, amount<=0, формат счёта, массив
            пуст или длиннее 2). Атомарно: не записано ничего.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /accounts/{id}/balance:
    get:
      summary: Баланс счёта
      description: Счёт без проводок — не ошибка, баланс 0.
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Account' }
      responses:
        '200':
          description: Баланс
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: { $ref: '#/components/schemas/Account' }
                  balance:
                    type: integer
                    description: Копейки, может быть отрицательным
                  entries_count: { type: integer }
        '400':
          description: Некорректный формат счёта
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  schemas:
    Account:
      type: string
      pattern: '^acc_[a-z0-9_]+$'
      example: acc_vasya
    Amount:
      type: integer
      minimum: 1
      description: Сумма в копейках
      example: 100000
    EntryInput:
      type: object
      required: [payment_id, debit, credit, amount]
      properties:
        payment_id: { type: string, minLength: 1 }
        debit: { $ref: '#/components/schemas/Account' }
        credit: { $ref: '#/components/schemas/Account' }
        amount: { $ref: '#/components/schemas/Amount' }
    Entry:
      type: object
      properties:
        id: { type: string, example: ent_x1y2z3 }
        payment_id: { type: string }
        debit: { $ref: '#/components/schemas/Account' }
        credit: { $ref: '#/components/schemas/Account' }
        amount: { $ref: '#/components/schemas/Amount' }
        created_at: { type: string, format: date-time }
    Error:
      type: object
      properties:
        error: { type: string }